# Publica la app en GitHub Pages cada vez que cambia la rama main.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Comprobar que sw.js está al día
        run: |
          cp sw.js /tmp/sw-antes.js
          node tools/build-sw.js
          cmp -s sw.js /tmp/sw-antes.js || { echo "sw.js desactualizado: ejecuta npm run build antes de publicar"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
